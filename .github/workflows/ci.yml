name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --extra test --extra dev --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run repository hooks
        run: uv run pre-commit run --all-files

  docker:
    name: Test and build runtime image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: myapp-ai:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: docker run --rm myapp-ai:test-${{ github.sha }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: myapp-ai:runtime-${{ github.sha }}
          build-args: |
            MYAPP_AI_RUNTIME_REVISION=${{ github.sha }}
          cache-from: type=gha

  integration:
    name: Standalone Compose integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate standalone Compose
        env:
          MYAPP_AI_ENV_FILE: integration.env
        run: docker compose --env-file integration.env -f compose.yaml -f compose.integration.yaml config --quiet

      - name: Start standalone integration stack
        env:
          MYAPP_AI_ENV_FILE: integration.env
        run: docker compose --env-file integration.env -f compose.yaml -f compose.integration.yaml up -d --build --wait

      - name: Run Chat and vector smoke tests
        run: python3 scripts/standalone_healthcheck.py --env-file integration.env --chat --vector

      - name: Collect service logs
        if: failure()
        env:
          MYAPP_AI_ENV_FILE: integration.env
        run: docker compose --env-file integration.env -f compose.yaml -f compose.integration.yaml logs --no-color

      - name: Stop standalone integration stack
        if: always()
        env:
          MYAPP_AI_ENV_FILE: integration.env
        run: docker compose --env-file integration.env -f compose.yaml -f compose.integration.yaml down --remove-orphans --volumes
