name: Publish runtime image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/myapp-ai

jobs:
  publish:
    name: Test and publish runtime image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=MyApp AI Orchestrator
            org.opencontainers.image.description=Enterprise AI orchestration service for MyApp
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: myapp-ai:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: docker run --rm myapp-ai:test-${{ github.sha }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MYAPP_AI_RUNTIME_REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
