[project]
name = "myapp-ai"
version = "0.1.0"
description = "Internal AI orchestration service for myapp"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"myapp_ai.evals.datasets" = ["*.json", "*.jsonl"]
