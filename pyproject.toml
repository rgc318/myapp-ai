[project]
name = "myapp-ai"
version = "0.1.0"
description = "Internal AI orchestration service for myapp"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "redis>=6.4,<7.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]
dev = ["pre-commit==4.6.1", "ruff==0.15.21"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["myapp_ai"]

[tool.setuptools.package-data]
"myapp_ai.evals.datasets" = ["*.json", "*.jsonl"]

[tool.setuptools.packages.find]
include = ["myapp_ai*"]
