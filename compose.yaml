name: myapp-ai

x-security: &security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  ai-orchestrator:
    image: ${MYAPP_AI_IMAGE:-myapp-ai}:${MYAPP_AI_TAG:-local}
    build:
      context: .
      target: runtime
      args:
        MYAPP_AI_RUNTIME_REVISION: ${MYAPP_AI_RUNTIME_REVISION:-unversioned}
        MYAPP_AI_RELEASE_ID: ${MYAPP_AI_RELEASE_ID:-standalone-local}
    restart: unless-stopped
    <<: *security
    env_file:
      - ${MYAPP_AI_ENV_FILE:-.env}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MYAPP_AI_ORCHESTRATOR_PORT:-4010}:4010
    volumes:
      - ./runtime/governance-reports:/var/lib/myapp-ai/governance-reports:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:4010/readyz', timeout=3)); assert data.get('ready') is True, data
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      ai-redis:
        condition: service_healthy
      ai-vector:
        condition: service_healthy
    networks:
      - edge
      - data

  ai-redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${MYAPP_AI_REDIS_PASSWORD:?MYAPP_AI_REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${MYAPP_AI_REDIS_PASSWORD:?MYAPP_AI_REDIS_PASSWORD is required}
    volumes:
      - ai-redis-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - data

  ai-vector-init:
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: "no"
    user: 0:0
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -c
    command:
      - mkdir -p /qdrant/storage/snapshots && chown -R 65534:65534 /qdrant/storage
    volumes:
      - ai-vector-data:/qdrant/storage
    networks:
      - data

  ai-vector:
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: unless-stopped
    user: 65534:65534
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ai-vector-data:/qdrant/storage
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      ai-vector-init:
        condition: service_completed_successfully
    networks:
      - data

volumes:
  ai-redis-data:
  ai-vector-data:

networks:
  edge:
  data:
    internal: true
